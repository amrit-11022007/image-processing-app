syntax = "proto3";

package imageprocessor;

service ImageProcessor {
    rpc ProcessImage (ImageRequest) returns (ImageResponse);
    rpc UploadImage (stream ImageChunk) returns (UploadResponse);
    rpc DownloadImage (DownloadRequest) returns (stream ImageChunk);
    rpc ProcessImageStream (stream ImageChunk) returns (stream ImageChunk);

    rpc Undo (HistoryRequest) returns (HistoryResponse);
    rpc Redo (HistoryRequest) returns (HistoryResponse);
    rpc GetHistory (HistoryRequest) returns (HistoryInfo);
}

message HistoryRequest {
    string session_id = 1;
}

message HistoryResponse {
    bytes image_data = 1;
    int32 width = 2;
    int32 height = 3;
    bool success = 4;
    string error = 5;
}

message HistoryInfo {
    int32 total_operations = 1;
    int32 current_position = 2;
    repeated string operation_names = 3;
}

message Empty {}

message ImageRequest {
    bytes image_data = 1;
    int32 width = 2;
    int32 height = 3;
    string operation = 4;
    int32 kernel_size = 5;
    double sigma = 6;
    string session_id = 7;
}

message ImageResponse {
    bytes processed_data = 1;
    int32 width = 2;
    int32 height = 3;
    string error = 4;
}

message ImageChunk {
    bytes data = 1;
    int32 chunk_number = 2;
    int32 total_chunks = 3;
    bool is_last = 4;
    int32 width = 5;
    int32 height = 6;
    string operation = 7;
    int32 kernel_size = 8;
    double sigma = 9;
    string request_id = 10;
    string session_id = 11;
}

message UploadResponse {
  bool success = 1;
  string message = 2;
  string request_id = 3;
  int32 total_bytes = 4;
  string session_id = 5;
}

message DownloadRequest {
  string request_id = 1;
  string operation = 2;
}